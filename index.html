<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game2Gen | AI Game Platform</title>

<!-- Space Grotesk & JetBrains Mono Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark: #07080a;
  --surface-card: #12151c;
  --accent-red: #ff2a4b;
  --accent-red-hover: #e01f3d;
  --text-primary: #ffffff;
  --text-muted: #9ba4b5;
  --border-light: rgba(255, 255, 255, 0.08);
  --font-main: 'Space Grotesk', -apple-system, sans-serif;
  --font-code: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-dark);
  color: var(--text-primary);
  font-family: var(--font-main);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Announcement Ticker Bar */
.announcement-bar {
  background: linear-gradient(90deg, #ff2a4b 0%, #8b5cf6 50%, #ff2a4b 100%);
  background-size: 200% auto;
  animation: shine 6s linear infinite;
  color: #fff;
  padding: 8px 16px;
  text-align: center;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 101;
}

.announcement-badge {
  background: #000;
  color: #fff;
  padding: 2px 8px;
  border-radius: 4px;
  font-family: var(--font-code);
  font-size: 0.65rem;
}

@keyframes shine {
  to { background-position: 200% center; }
}

/* Header Navbar */
header {
  height: 70px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: fixed;
  top: 33px; left: 0; right: 0;
  z-index: 100;
  background: linear-gradient(180deg, rgba(7, 8, 10, 0.95) 0%, rgba(7, 8, 10, 0) 100%);
  backdrop-filter: blur(8px);
}

.logo-badge {
  background: var(--accent-red);
  color: #fff;
  font-family: var(--font-main);
  font-weight: 900;
  font-size: 1.1rem;
  padding: 4px 12px;
  border-radius: 4px;
  letter-spacing: -0.5px;
  text-transform: uppercase;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn-login {
  background: transparent;
  color: #fff;
  border: 1px solid var(--border-light);
  padding: 8px 16px;
  border-radius: 6px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.btn-login:hover {
  background: rgba(255, 255, 255, 0.05);
  border-color: rgba(255, 255, 255, 0.2);
}

.btn-upload {
  background: var(--accent-red);
  color: #fff;
  border: 0;
  padding: 10px 20px;
  border-radius: 6px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.2s, background 0.2s;
}

.btn-upload:hover {
  background: var(--accent-red-hover);
  transform: translateY(-2px);
}

.user-profile-badge {
  display: none;
  align-items: center;
  gap: 8px;
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 600;
}

.user-avatar {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--accent-red);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 900;
}

/* Featured Split Hero Section */
.hero-stage {
  position: relative;
  height: 68vh;
  min-height: 500px;
  margin-top: 53px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  background: radial-gradient(circle at 70% 50%, #1e112a 0%, var(--bg-dark) 70%);
  overflow: hidden;
}

.hero-left {
  max-width: 560px;
  z-index: 2;
}

.hero-slogan {
  font-family: var(--font-code);
  font-size: 0.85rem;
  color: var(--accent-red);
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-bottom: 12px;
  display: block;
}

.hero-title {
  font-weight: 900;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  text-transform: uppercase;
  letter-spacing: -1.5px;
  line-height: 0.95;
  margin-bottom: 14px;
  background: linear-gradient(180deg, #ffffff 0%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-catchphrase {
  font-size: 1.1rem;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 24px;
  font-weight: 400;
}

.hero-actions {
  display: flex;
  gap: 12px;
}

.btn-action-primary {
  background: var(--accent-red);
  color: #fff;
  border: 0;
  padding: 12px 28px;
  border-radius: 6px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.2s;
}

.btn-action-primary:hover {
  transform: scale(1.04);
}

.btn-action-secondary {
  background: rgba(255, 255, 255, 0.95);
  color: #000;
  border: 0;
  padding: 12px 28px;
  border-radius: 6px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.2s;
}

.btn-action-secondary:hover {
  transform: scale(1.04);
}

.hero-right-graphic {
  position: relative;
  width: 45%;
  height: 80%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}

.hero-preview-box {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  border: 1px solid var(--border-light);
  background: #000;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0,0,0,0.8);
}

.hero-preview-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
}

/* Sections & Carousels */
.section-container {
  padding: 30px 40px;
}

.section-heading {
  font-weight: 700;
  font-size: 1.4rem;
  margin-bottom: 16px;
  letter-spacing: -0.5px;
}

.card-carousel {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 16px;
  scrollbar-width: none;
}

.card-carousel::-webkit-scrollbar { display: none; }

/* Numbered Top 10 Card Style */
.top10-card {
  flex: 0 0 220px;
  display: flex;
  align-items: flex-end;
  position: relative;
  cursor: pointer;
}

.top10-rank {
  font-weight: 900;
  font-size: 7.5rem;
  line-height: 0.75;
  color: #000;
  -webkit-text-stroke: 3px rgba(255, 255, 255, 0.7);
  position: absolute;
  left: -20px;
  bottom: 15px;
  z-index: 3;
  pointer-events: none;
}

.poster-inner {
  width: 160px;
  height: 230px;
  margin-left: 50px;
  background: var(--surface-card);
  border-radius: 8px;
  border: 1px solid var(--border-light);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s;
}

.top10-card:hover .poster-inner {
  transform: translateY(-6px) scale(1.02);
  border-color: var(--accent-red);
}

.poster-bg {
  position: absolute;
  inset: 0;
  opacity: 0.6;
  z-index: 1;
}

.poster-content {
  position: relative;
  z-index: 2;
}

.poster-title {
  font-weight: 700;
  font-size: 1rem;
  text-transform: uppercase;
  line-height: 1.1;
  margin-bottom: 8px;
}

.btn-card-create {
  width: 100%;
  background: var(--accent-red);
  color: #fff;
  border: 0;
  padding: 6px 0;
  border-radius: 4px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.7rem;
  text-transform: uppercase;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: background 0.2s, transform 0.1s;
}

.btn-card-create:hover {
  background: var(--accent-red-hover);
  transform: scale(1.02);
}

/* Grid for Standard Originals */
.grid-row {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  scrollbar-width: none;
}

.standard-card {
  flex: 0 0 160px;
  height: 230px;
  background: var(--surface-card);
  border-radius: 8px;
  border: 1px solid var(--border-light);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 12px;
  cursor: pointer;
  transition: transform 0.3s, border-color 0.3s;
}

.standard-card:hover {
  transform: translateY(-6px);
  border-color: var(--accent-red);
}

/* Modals General */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(10px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 600;
  padding: 20px;
}

.modal-overlay.active { display: flex; }

.modal-box {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: 12px;
  width: min(440px, 100%);
  padding: 32px;
  position: relative;
}

/* Fullscreen Game Player Modal */
.game-player-box {
  width: min(900px, 95vw);
  height: min(650px, 85vh);
  background: #000;
  border-radius: 12px;
  border: 1px solid var(--border-light);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);
}

.game-player-header {
  height: 50px;
  background: var(--surface-card);
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
}

.game-player-title {
  font-weight: 700;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.game-player-close {
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
  line-height: 1;
}

.game-player-close:hover {
  color: #fff;
}

.game-player-frame {
  flex: 1;
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

.close-btn {
  position: absolute;
  right: 18px; top: 18px;
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-size: 1.5rem;
  cursor: pointer;
}

.field-group { margin-bottom: 14px; }
.field-group label {
  display: block;
  font-size: 0.7rem;
  font-family: var(--font-code);
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.field-group input, .field-group select, .field-group textarea {
  width: 100%;
  background: var(--bg-dark);
  border: 1px solid var(--border-light);
  border-radius: 6px;
  padding: 12px;
  color: #fff;
  font-family: var(--font-main);
  font-size: 0.85rem;
  outline: 0;
}

.field-group input:focus, .field-group select:focus {
  border-color: var(--accent-red);
}

/* Auth Specific Styles */
.auth-tabs {
  display: flex;
  gap: 16px;
  border-bottom: 1px solid var(--border-light);
  margin-bottom: 24px;
}

.auth-tab {
  background: transparent;
  border: 0;
  color: var(--text-muted);
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.9rem;
  text-transform: uppercase;
  padding-bottom: 8px;
  cursor: pointer;
  position: relative;
}

.auth-tab.active {
  color: #fff;
}

.auth-tab.active::after {
  content: '';
  position: absolute;
  bottom: -1px; left: 0; right: 0;
  height: 2px;
  background: var(--accent-red);
}

.btn-google {
  width: 100%;
  background: #ffffff;
  color: #000000;
  border: 0;
  padding: 12px;
  border-radius: 6px;
  font-family: var(--font-main);
  font-weight: 700;
  font-size: 0.85rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 20px;
  transition: opacity 0.2s;
}

.btn-google:hover {
  opacity: 0.9;
}

.auth-divider {
  display: flex;
  align-items: center;
  text-align: center;
  color: var(--text-muted);
  font-family: var(--font-code);
  font-size: 0.7rem;
  margin-bottom: 20px;
}

.auth-divider::before, .auth-divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid var(--border-light);
}

.auth-divider span {
  padding: 0 10px;
}
</style>
</head>
<body>

<!-- Main Application -->
<div id="mainApp">
  <!-- Announcement Bar -->
  <div class="announcement-bar">
    <span class="announcement-badge">WORLD FIRST</span>
    <span>Welcome to the World's First AI Game Console</span>
  </div>

  <header>
    <div class="logo-badge">Game2Gen</div>
    <div class="header-right">
      <button class="btn-login" id="openAuthBtn">Sign In</button>
      <div class="user-profile-badge" id="userBadge">
        <div class="user-avatar" id="userAvatar">U</div>
        <span id="userName">User</span>
      </div>
      <button class="btn-upload" id="openUploadBtn">
        Deploy HTML
      </button>
    </div>
  </header>

  <!-- Featured Split Hero Stage -->
  <section class="hero-stage">
    <div class="hero-left">
      <span class="hero-slogan">● Next-Gen Neural Engine</span>
      <h1 class="hero-title" id="heroTitle">CYBER DODGE</h1>
      <p class="hero-catchphrase">Don't just play worlds. Prompt them into existence.</p>
      <div class="hero-actions">
        <button class="btn-action-primary" onclick="launchActiveGame()">
          Play Sandbox
        </button>
        <button class="btn-action-secondary" id="openUploadHero">
          Deploy New
        </button>
      </div>
    </div>

    <div class="hero-right-graphic">
      <div class="hero-preview-box">
        <iframe id="heroIframe" sandbox="allow-scripts allow-same-origin"></iframe>
      </div>
    </div>
  </section>

  <!-- Numbered Top 10 Section -->
  <section class="section-container">
    <h2 class="section-heading">Top 10 AI Games Today</h2>
    <div class="card-carousel" id="top10Row"></div>
  </section>

  <!-- Originals Section -->
  <section class="section-container">
    <h2 class="section-heading">Game2Gen Originals</h2>
    <div class="grid-row" id="originalsRow"></div>
  </section>
</div>

<!-- Active Play Modal (Popup Game Window) -->
<div class="modal-overlay" id="gameModal">
  <div class="game-player-box">
    <div class="game-player-header">
      <span class="game-player-title" id="modalGameTitle">Playing Game</span>
      <button class="game-player-close" onclick="closeGameModal()">✕</button>
    </div>
    <iframe class="game-player-frame" id="gameModalIframe" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
</div>

<!-- Auth Modal (Google / Email Login) -->
<div class="modal-overlay" id="authModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('authModal')">×</button>
    
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
      <button class="auth-tab" id="tabSignUp" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>

    <!-- Google OAuth Direct Action -->
    <button class="btn-google" onclick="handleGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">
      <span>OR EMAIL</span>
    </div>

    <!-- Email Form -->
    <form id="authForm">
      <div class="field-group" id="nameGroup" style="display: none;">
        <label>Full Name</label>
        <input type="text" id="authName" placeholder="Alex Vance">
      </div>
      <div class="field-group">
        <label>Email Address</label>
        <input type="email" id="authEmail" placeholder="developer@domain.com" required>
      </div>
      <div class="field-group">
        <label>Password</label>
        <input type="password" id="authPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-upload" id="authSubmitBtn" style="width: 100%; justify-content: center; margin-top: 16px;">
        Sign In
      </button>
    </form>
  </div>
</div>

<!-- Upload Source Modal -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal-box">
    <button class="close-btn" onclick="closeModal('uploadModal')">×</button>
    <h3 style="font-weight: 700; text-transform: uppercase; margin-bottom: 16px;">Deploy Project Source</h3>

    <form id="uploadForm">
      <div class="field-group">
        <label>Game Title</label>
        <input type="text" id="gameTitle" placeholder="e.g. Retro Racer" required>
      </div>
      <div class="field-group">
        <label>LLM Engine</label>
        <select id="gameModel">
          <option value="Claude 3.5 Sonnet">Claude 3.5 Sonnet</option>
          <option value="ChatGPT (GPT-4o)">ChatGPT (GPT-4o)</option>
          <option value="Grok 2">Grok 2</option>
        </select>
      </div>
      <div class="field-group">
        <label>Author Handle</label>
        <input type="text" id="gameAuthor" placeholder="Developer name" required>
      </div>
      <div class="field-group">
        <label>HTML Binary File</label>
        <input type="file" id="gameFile" accept=".html,.htm" required>
      </div>
      <button type="submit" class="btn-upload" style="width: 100%; justify-content: center; margin-top: 10px;">Publish Game</button>
    </form>
  </div>
</div>

<script>
let currentAuthMode = 'signin';
let currentUser = null;

const games = [
  {
    id: "1",
    title: "Cyber Dodge",
    author: "DevAdept",
    model: "Claude 3.5 Sonnet",
    bg: "linear-gradient(180deg, #4c1d95 0%, #12151c 100%)",
    code: `<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#000;color:#ff[...]
  },
  {
    id: "2",
    title: "Vector Pong",
    author: "GPTCoder",
    model: "ChatGPT (GPT-4o)",
    bg: "linear-gradient(180deg, #0284c7 0%, #12151c 100%)",
    code: `<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#000;color:#ff[...]
  },
  {
    id: "3",
    title: "Matrix Rain",
    author: "NeonPulse",
    model: "Grok 2",
    bg: "linear-gradient(180deg, #be123c 0%, #12151c 100%)",
    code: `<!DOCTYPE html><html><head><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#000;overflow:[...]
  }
];

let activeIndex = 0;

function setActiveGame(index) {
  activeIndex = index;
  const game = games[index];

  document.getElementById("heroTitle").textContent = game.title;
  document.getElementById("heroIframe").srcdoc = game.code;
}

function launchActiveGame() {
  const game = games[activeIndex];
  if (!game) return;

  document.getElementById("modalGameTitle").textContent = game.title;
  const modalIframe = document.getElementById("gameModalIframe");
  modalIframe.srcdoc = game.code;

  openModal("gameModal");
}

function runGameDirect(event, index) {
  event.stopPropagation();
  setActiveGame(index);
  launchActiveGame();
}

function closeGameModal() {
  const modalIframe = document.getElementById("gameModalIframe");
  modalIframe.srcdoc = "";
  closeModal("gameModal");
}

function renderCarousels() {
  const top10Row = document.getElementById("top10Row");
  const originalsRow = document.getElementById("originalsRow");

  top10Row.innerHTML = "";
  originalsRow.innerHTML = "";

  games.forEach((game, i) => {
    // Top 10 Card
    const topCard = document.createElement("div");
    topCard.className = "top10-card";
    topCard.onclick = () => setActiveGame(i);

    topCard.innerHTML = `
      <div class="top10-rank">${i + 1}</div>
      <div class="poster-inner">
        <div class="poster-bg" style="background: ${game.bg};"></div>
        <div class="poster-content">
          <div class="poster-title">${game.title}</div>
          <button class="btn-card-create" onclick="runGameDirect(event, ${i})">Run Game</button>
        </div>
      </div>
    `;
    top10Row.appendChild(topCard);

    // Standard Card
    const stdCard = document.createElement("div");
    stdCard.className = "standard-card";
    stdCard.onclick = () => setActiveGame(i);

    stdCard.innerHTML = `
      <div class="poster-bg" style="background: ${game.bg};"></div>
      <div class="poster-content">
        <div class="poster-title">${game.title}</div>
        <button class="btn-card-create" onclick="runGameDirect(event, ${i})">Run Game</button>
      </div>
    `;
    originalsRow.appendChild(stdCard);
  });
}

/* Auth System Functions */
function switchAuthTab(mode) {
  currentAuthMode = mode;
  const tabSignIn = document.getElementById("tabSignIn");
  const tabSignUp = document.getElementById("tabSignUp");
  const nameGroup = document.getElementById("nameGroup");
  const submitBtn = document.getElementById("authSubmitBtn");

  if (mode === 'signup') {
    tabSignUp.classList.add("active");
    tabSignIn.classList.remove("active");
    nameGroup.style.display = "block";
    submitBtn.textContent = "Create Account";
  } else {
    tabSignIn.classList.add("active");
    tabSignUp.classList.remove("active");
    nameGroup.style.display = "none";
    submitBtn.textContent = "Sign In";
  }
}

function handleGoogleAuth() {
  loginUser({ name: "Google Creator", email: "creator@gmail.com" });
}

function loginUser(userData) {
  currentUser = userData;
  document.getElementById("openAuthBtn").style.display = "none";
  const userBadge = document.getElementById("userBadge");
  userBadge.style.display = "flex";
  document.getElementById("userName").textContent = currentUser.name;
  document.getElementById("userAvatar").textContent = currentUser.name.charAt(0).toUpperCase();

  document.getElementById("gameAuthor").value = currentUser.name;

  closeModal("authModal");
}

/* Modal Open/Close Controls */
function openModal(id) { document.getElementById(id).classList.add("active"); }
function closeModal(id) { document.getElementById(id).classList.remove("active"); }

document.getElementById("openAuthBtn").onclick = () => openModal("authModal");
document.getElementById("openUploadBtn").onclick = () => openModal("uploadModal");
document.getElementById("openUploadHero").onclick = () => openModal("uploadModal");

/* Form Actions */
document.getElementById("authForm").onsubmit = function(e) {
  e.preventDefault();
  const email = document.getElementById("authEmail").value;
  const name = currentAuthMode === 'signup' ? document.getElementById("authName").value : email.split('@')[0];
  loginUser({ name: name || "User", email: email });
};

document.getElementById("uploadForm").onsubmit = function(e) {
  e.preventDefault();
  const title = document.getElementById("gameTitle").value.trim();
  const model = document.getElementById("gameModel").value;
  const author = document.getElementById("gameAuthor").value.trim();
  const fileInput = document.getElementById("gameFile");

  if (!fileInput.files || !fileInput.files[0]) return;

  const reader = new FileReader();
  reader.onload = function(evt) {
    const newGame = {
      id: String(Date.now()),
      title, model, author,
      bg: "linear-gradient(180deg, #334155 0%, #12151c 100%)",
      code: evt.target.result
    };
    games.unshift(newGame);
    closeModal("uploadModal");
    document.getElementById("uploadForm").reset();
    renderCarousels();
    setActiveGame(0);
  };
  reader.readAsText(fileInput.files[0]);
};

// Initialize
renderCarousels();
setActiveGame(0);
</script>
